name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_BASE_PATH: /mot-kiep-viet/
      E2E_PRODUCTION: '1'
      VITE_CLOUD_ENABLED: 'true'
      VITE_SUPABASE_URL: https://kqnapcyceddwvrvkquvg.supabase.co
      # Intentionally public client key. Never place a secret/service-role key here.
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_36fkaACnrCtpGy2dYggmjA_KKdt3h5Z
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/scan-secrets.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
